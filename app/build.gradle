plugins { id 'com.android.application' }
android {
    namespace 'uk.local.wrestlingchronology'
    compileSdk 35
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/sourceConfigAssets')
    // Sideloaded Fire OS 6+ APK; Google Play's target policy does not apply.
    lint { disable 'ExpiredTargetSdkVersion' }
    defaultConfig {
        applicationId 'uk.local.wrestlingchronology'
        minSdk 25
        targetSdk 28
        versionCode 12
        versionName '0.1.6'
        buildConfigField 'String', 'COMMUNITY_BASE_URL', groovy.json.JsonOutput.toJson(System.getenv('WC_COMMUNITY_BASE_URL') ?: '')
        buildConfigField 'String', 'COMMUNITY_APP_KEY', groovy.json.JsonOutput.toJson(System.getenv('WC_COMMUNITY_APP_KEY') ?: '')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
    signingConfigs {
        release {
            if (System.getenv('WRESTLING_KEYSTORE')) {
                storeFile file(System.getenv('WRESTLING_KEYSTORE'))
                storePassword System.getenv('WRESTLING_STORE_PASSWORD')
                keyAlias System.getenv('WRESTLING_KEY_ALIAS')
                keyPassword System.getenv('WRESTLING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false; if (System.getenv('WRESTLING_KEYSTORE')) signingConfig signingConfigs.release }
    }
    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/versions/**']
        resources.merges += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}
tasks.register('prepareSourceConfig', Copy) {
    from rootProject.file('sources')
    into layout.buildDirectory.dir('generated/sourceConfigAssets/sources')
}
tasks.named('preBuild').configure { dependsOn 'prepareSourceConfig' }
dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation('androidx.media3:media3-datasource-cronet:1.8.0') {
        exclude group: 'com.google.android.gms'
    }
    // Embedded Chromium networking also works on Fire TV without Google Play Services.
    implementation 'org.chromium.net:cronet-embedded:119.6045.31'
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}

tasks.register('prepareLibraryRevisions') {
    inputs.file rootProject.file('catalogue/manifest.json')
    def destination = layout.buildDirectory.file('generated/sourceConfigAssets/library-revisions.json')
    outputs.file destination
    doLast {
        def feed = new groovy.json.JsonSlurper().parse(rootProject.file('catalogue/manifest.json'))
        def revisions = feed.companies.collectEntries { id, entry -> [(id): entry.revision] }
        def output = destination.get().asFile
        output.parentFile.mkdirs()
        output.setText(groovy.json.JsonOutput.toJson(revisions), 'UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareLibraryRevisions' }
